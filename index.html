<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PharmaSentinel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-canvas {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            padding: 24px;
        }
        .login-card {
            background: #ffffff !important;
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4);
        }
        .btn-submit-login {
            background: #0f172a !important;
            color: #ffffff !important; /* Fix tulisan gelap di tombol hitam */
            font-weight: 700;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-submit-login:hover {
            background: #1e293b !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.3);
        }
        .demo-shortcut-btn {
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            width: 100%;
            text-align: left;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: #0f172a !important;
            margin-bottom: 10px;
        }
        .demo-shortcut-btn:hover {
            border-color: #0d9488;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 148, 136, 0.12);
        }
    </style>
</head>
<body class="login-canvas">

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-4 mb-2" style="background: #ccfbf1; color: #0d9488; font-size: 1.8rem;">
                <i class="bi bi-shield-check"></i>
            </div>
            <h4 class="fw-bold m-0" style="color: #0f172a;">PharmaSentinel</h4>
            <p class="small" style="color: #475569;">Sistem Informasi Apotek & Antrean FEFO Otomatis</p>
        </div>

        <form onsubmit="handleFormalLogin(event)">
            <div class="mb-3">
                <label class="form-label small fw-bold" style="color: #0f172a;">Username</label>
                <input type="text" class="form-control rounded-pill px-3 py-2" placeholder="Nama pengguna..." id="loginUser">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold" style="color: #0f172a;">Kata Sandi</label>
                <input type="password" class="form-control rounded-pill px-3 py-2" placeholder="••••••••" id="loginPass">
            </div>
            <button type="submit" class="btn btn-submit-login w-100 py-2 rounded-pill mb-4">
                Masuk Sistem
            </button>
        </form>

        <div class="border-top pt-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold" style="font-size: 0.72rem; letter-spacing: 0.5px; color: #475569;">PINTASAN DEMO PENGUJI:</span>
                <span class="badge bg-secondary-subtle text-secondary rounded-pill small">1-Click Access</span>
            </div>

            <a href="kasir-pos.html" class="demo-shortcut-btn">
                <div class="p-2 rounded-3 bg-light fs-5" style="color: #059669;">
                    <i class="bi bi-cart-check"></i>
                </div>
                <div>
                    <div class="fw-bold small" style="color: #0f172a;">Masuk sebagai Kasir</div>
                    <div style="font-size: 0.72rem; color: #475569;">Hanya Transaksi & Mesin FEFO (Tanpa Data Sensitif)</div>
                </div>
            </a>

            <a href="admin-dashboard.html" class="demo-shortcut-btn">
                <div class="p-2 rounded-3 bg-light fs-5" style="color: #2563eb;">
                    <i class="bi bi-boxes"></i>
                </div>
                <div>
                    <div class="fw-bold small" style="color: #0f172a;">Masuk sebagai Admin Gudang</div>
                    <div style="font-size: 0.72rem; color: #475569;">Radar ED H-90, Master Obat, & Retur Karantina</div>
                </div>
            </a>
        </div>
    </div>

    <script>
        function handleFormalLogin(e) {
            e.preventDefault();
            window.location.href = "kasir-pos.html";
        }
    </script>
</body>
</html>
